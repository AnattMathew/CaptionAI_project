services:
  - type: web
    name: captionai-backend
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn captionai_backend.wsgi:application --preload --log-file -
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: SECRET_KEY
        generateValue: true
      - key: SERVE_MEDIA
        value: "true"
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
